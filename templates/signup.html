<div class="auth">
  <h1>Create your account</h1>
  <p class="sub">Set up your business in under a minute.</p>
  {{ERROR}}
  <form method="post" action="/signup" class="panel" style="margin-top:18px">
    <div class="field">
      <label for="business_name">Business name</label>
      <input type="text" id="business_name" name="business_name" required
             placeholder="Demo Plumbing Co." value="{{BUSINESS_NAME}}">
    </div>
    <div class="field">
      <label for="email">Work email</label>
      <input type="email" id="email" name="email" required
             placeholder="you@yourcompany.com" value="{{EMAIL}}">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required
             placeholder="At least 8 characters" minlength="8">
    </div>
    <button class="btn primary" type="submit">Create account</button>
    <p class="muted" style="margin-top:16px;font-size:14px">
      Already have one? <a href="/login">Log in</a>
    </p>
  </form>
</div>
