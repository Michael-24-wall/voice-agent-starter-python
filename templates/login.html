<div class="auth-wrap">
  <div class="card">
    <div class="auth-head">
      <h1>Welcome back</h1>
      <p class="muted">Sign in to your CallDesk account.</p>
    </div>

    {{ERROR}}

    <form method="post" action="/login" class="stack">
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{EMAIL}}"
               autocomplete="email" required autofocus>
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-block btn-lg" type="submit">Sign in</button>
    </form>

    <div class="divider" style="margin:20px 0">or</div>

    <a class="btn btn-secondary btn-block google-btn" href="/auth/google">
      {{GOOGLE_MARK}}Sign in with Google
    </a>
    {{GOOGLE_HINT}}

    <p class="auth-foot">Don't have an account? <a href="/signup">Create one</a></p>
  </div>
</div>
