<div class="page-head">
  <div>
    <h1>Answering settings for <span class="mono">{{PHONE_NUMBER}}</span></h1>
    <p class="sub">What should happen when this number rings.</p>
  </div>
</div>

{{ERROR}}

<form method="post" action="/settings/answering" class="card stack" id="answering-form">
  <input type="hidden" name="phone_number" value="{{PHONE_NUMBER}}">

  <div>
    <div class="row" style="margin-bottom:12px">
      <span class="badge {{MODE_A_PILL}}">CallDesk answers</span>
      <span class="badge {{MODE_B_PILL}}">Ring mobile first</span>
    </div>

    <label class="radio-card">
      <span class="radio-card-head">
        <input type="radio" name="answering_mode" value="agent" id="mode-agent" {{SEL_AGENT}}>
        <span>
          <span class="rt">CallDesk answers directly</span>
          <span class="rd">Every call goes straight to the AI receptionist.</span>
        </span>
      </span>
    </label>

    <label class="radio-card">
      <span class="radio-card-head">
        <input type="radio" name="answering_mode" value="human_first" id="mode-human" {{SEL_HUMAN}}>
        <span>
          <span class="rt">Ring my mobile first, CallDesk if I don't answer</span>
          <span class="rd">CallDesk is the fallback when you're busy.</span>
        </span>
      </span>
      <span class="reveal" id="forward-reveal">
        <span class="form-field" style="margin-top:14px">
          <label for="forward_to">Mobile number to ring first</label>
          <input type="tel" id="forward_to" name="forward_to" value="{{FORWARD_TO}}"
                 placeholder="+15558889999" autocomplete="tel">
          <span class="form-hint">
            Calls ring here first. If nobody answers, CallDesk picks up and takes the details.
          </span>
        </span>
      </span>
    </label>
  </div>

  <div class="row-end">
    <a class="btn btn-ghost" href="/numbers">Cancel</a>
    <button class="btn btn-primary btn-lg" type="submit">Save settings</button>
  </div>
</form>

<script>
(function () {
  "use strict";
  var human = document.getElementById("mode-human");
  var reveal = document.getElementById("forward-reveal");
  if (!human || !reveal) { return; }
  function sync() { reveal.hidden = !human.checked; }
  human.addEventListener("change", sync);
  sync();
})();
</script>
