<div class="page-head">
  <div>
    <h1>Welcome back, {{BUSINESS_NAME}}</h1>
    <p class="sub">{{EMAIL}}</p>
  </div>
  <div class="row-end">
    <a class="btn btn-secondary" href="/settings/answering">Answering settings</a>
    <a class="btn btn-primary" href="/talk" target="_blank" rel="noopener">Talk to CallDesk</a>
  </div>
</div>

<div class="stat-grid">
  <div class="card card-hover">
    <div class="stat-label">Calls today</div>
    <div class="card-value">{{CALLS_TODAY}}</div>
  </div>
  <div class="card card-hover">
    <div class="stat-label">Calls this week</div>
    <div class="card-value">{{CALLS_WEEK}}</div>
  </div>
  <div class="card card-hover">
    <div class="stat-label">Phone numbers</div>
    <div class="card-value">{{NUMBERS_COUNT}}</div>
  </div>
</div>

{{TWILIO_BANNER}}

<div class="card" style="padding:0">
  <div class="row-between" style="padding:20px 24px 16px">
    <div class="card-title" style="margin:0">Recent calls</div>
    <a class="btn btn-ghost btn-sm" href="/calls">View all calls</a>
  </div>
  <div class="table-wrap" style="padding-bottom:8px">
    {{RECENT_CALLS}}
  </div>
</div>

<div class="card" style="padding:0">
  <div class="row-between" style="padding:20px 24px 16px">
    <div class="card-title" style="margin:0">Your numbers</div>
    <a class="btn btn-ghost btn-sm" href="/numbers">Manage numbers</a>
  </div>
  <div class="table-wrap" style="padding-bottom:8px">
    {{NUMBERS}}
  </div>
</div>
