<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>{{TITLE}} &middot; CallDesk</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%230b7369'/><path d='M8 20h3l2-7 2 11 2-9 1.5 5H24' fill='none' stroke='%23ffffff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="app-header">
  <div class="bar">
    <a href="/" class="logo" aria-label="CallDesk home">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 13h3l2.5-8 3 16 3-12 2 6h4.5"/>
        </svg>
      </span>
      <span class="logo-word">CallDesk</span>
    </a>
    {{NAV}}
  </div>
</header>

<main class="shell" id="main">
{{CONTENT}}
</main>

<footer class="app-footer">
  <div class="bar">
    <span>CallDesk &middot; Built on AssemblyAI Voice Agent API &middot; Powered by Twilio</span>
    <span class="footer-right">
      <a href="/guide">Help</a>
      <span>&copy; CallDesk</span>
    </span>
  </div>
</footer>

<div class="toast-stack" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script>
(function () {
  "use strict";

  // --- user menu ---------------------------------------------------------
  var menu = document.querySelector(".user-menu");
  var button = menu && menu.querySelector(".user-button");
  if (button) {
    button.addEventListener("click", function (event) {
      event.stopPropagation();
      var open = menu.classList.toggle("open");
      button.setAttribute("aria-expanded", open ? "true" : "false");
    });
    document.addEventListener("click", function () {
      menu.classList.remove("open");
      button.setAttribute("aria-expanded", "false");
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") { menu.classList.remove("open"); }
    });
  }

  // --- mobile nav --------------------------------------------------------
  var burger = document.getElementById("nav-toggle");
  var nav = document.getElementById("primary-nav");
  if (burger && nav) {
    burger.addEventListener("click", function () {
      var open = nav.classList.toggle("open");
      burger.setAttribute("aria-expanded", open ? "true" : "false");
    });
  }

  // --- active nav link, from the current path ----------------------------
  var here = location.pathname.replace(/\/$/, "") || "/";
  var links = document.querySelectorAll("#primary-nav a");
  for (var i = 0; i < links.length; i++) {
    var path = links[i].getAttribute("href").split("?")[0].replace(/\/$/, "") || "/";
    if (path === here || (path !== "/" && here.indexOf(path) === 0)) {
      links[i].classList.add("active");
      links[i].setAttribute("aria-current", "page");
    }
  }

  // --- toasts ------------------------------------------------------------
  var stack = document.getElementById("toasts");

  function dismiss(node) {
    node.classList.add("is-leaving");
    setTimeout(function () { node.remove(); }, 200);
  }

  window.callDeskToast = function (message, kind) {
    if (!stack || !message) { return; }
    var node = document.createElement("div");
    node.className = kind === "danger" ? "toast toast-danger" : "toast";
    node.setAttribute("role", kind === "danger" ? "alert" : "status");
    var text = document.createElement("div");
    text.className = "grow";
    text.textContent = message;
    var close = document.createElement("button");
    close.className = "x";
    close.type = "button";
    close.setAttribute("aria-label", "Dismiss notification");
    close.textContent = "\u00d7";
    close.addEventListener("click", function () { dismiss(node); });
    node.append(text, close);
    stack.append(node);
    setTimeout(function () { dismiss(node); }, 4000);
  };

  // A flash written by the server right before a redirect.
  var FLASH = "calldesk_flash";
  document.cookie.split("; ").forEach(function (pair) {
    var eq = pair.indexOf("=");
    if (eq < 0) { return; }
    var name = pair.slice(0, eq);
    if (name !== FLASH) { return; }
    var raw = pair.slice(eq + 1);
    try { raw = decodeURIComponent(raw); } catch (err) { /* keep raw */ }
    var sep = raw.indexOf("|");
    window.callDeskToast(sep < 0 ? raw : raw.slice(sep + 1),
                         sep > 0 && raw.slice(0, sep) === "danger" ? "danger" : "ok");
    document.cookie = FLASH + "=; Path=/; Max-Age=0; SameSite=Lax";
  });
})();
</script>
</body>
</html>
